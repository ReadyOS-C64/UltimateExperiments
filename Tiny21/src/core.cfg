MEMORY {
    ZP:     start = $0080, size = $0070, type = rw;
    CORE:   start = $1000, size = $4000, type = rw, file = %O;
    WORK:   start = $5000, size = $3000, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = CORE, type = ro;
    RODATA:   load = CORE, type = ro, align = $100;
    BSS:      load = WORK, type = bss;
}
