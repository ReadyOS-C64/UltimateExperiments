MEMORY {
    ZP:     start = $0080, size = $0070, type = rw;
    CORE:   start = $1000, size = $4400, type = rw, file = %O;
    WORK:   start = $5400, size = $2C00, type = rw, define = yes;
    SCORES: start = $E000, size = $1FE0, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = CORE, type = ro;
    RODATA:   load = CORE, type = ro, align = $100;
    BSS:      load = WORK, type = bss;
    SCORES:   load = SCORES, type = bss, define = yes;
}
