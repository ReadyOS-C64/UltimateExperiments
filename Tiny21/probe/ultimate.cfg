MEMORY {
    ZP:     start = $0080, size = $0070, type = rw, file = "";
    LOAD:   start = $07FF, size = $0002, file = %O;
    BASIC:  start = $0801, size = $07FF, file = %O, fill = yes;
    CORE:   start = $1000, size = $4400, file = %O, fill = yes;
    WORK:   start = $5400, size = $2C00, type = rw, file = "", define = yes;
    IMAGE:  start = $5400, size = $2C00, file = %O;
    PROBE:  start = $A000, size = $2000, type = rw, file = "";
    SCORES: start = $E000, size = $1FE0, type = rw, file = "";
}
SEGMENTS {
    LOADADDR: load = LOAD, type = ro;
    STARTUP:  load = BASIC, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = CORE, type = ro;
    RODATA:   load = CORE, type = ro, align = $100;
    BSS:      load = WORK, type = bss;
    SCORES:   load = SCORES, type = bss, define = yes, optional = yes;
    PROBE:    load = IMAGE, run = PROBE, type = ro, define = yes, align = $100;
    PROBEBSS: load = PROBE, type = bss, define = yes;
}
