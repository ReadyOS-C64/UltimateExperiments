<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1140" viewBox="0 0 760 1140" role="img" aria-labelledby="title desc">
<title id="title">Execution RAM and database REU are separate</title><desc id="desc">The C64 contains the client, resident engine, work RAM, stack, active overlay and ABI. REU reservations contain superblocks, bitmap, administrative cache, database allocator, journal and eight execution caches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ed9d0"/></marker></defs>
<rect width="760" height="1140" rx="18" fill="#101e2c"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#e8f2f4}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#b8cbd6}.mono{font:20px ui-monospace,Consolas,monospace;fill:#8de1d9}.arrow{fill:none;stroke:#6ed9d0;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="46">Execution RAM and database REU are separate</text>
<text class="label" x="42" y="95">C64 address space</text><rect x="42" y="116" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="141">$0801–$30FF</text><text class="small" x="282" y="155">Client application / shell</text><rect x="42" y="189" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="214">$3100–$5B9F</text><text class="small" x="282" y="228">Resident engine</text><rect x="42" y="262" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="287">$5BA0–$77FF</text><text class="small" x="282" y="301">Work RAM and row/value staging</text><rect x="42" y="335" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="360">$7800–$7BFF</text><text class="small" x="282" y="374">1 KB software C stack</text><rect x="42" y="408" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="433">$7C00–$BFFF</text><text class="small" x="282" y="447">One shared 17 KB overlay window</text><rect x="42" y="481" width="676" height="63" rx="5" fill="#1e3548"/><text class="mono" x="58" y="506">$C000–$CFFF</text><text class="small" x="282" y="520">Public ABI, bridges and controls</text><text class="label" x="42" y="598">REU pages: 512 KB through 16 MB</text><rect x="42" y="620" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="658">0–1</text><text class="small" x="282" y="658">Redundant superblocks</text><rect x="42" y="693" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="731">2–33</text><text class="small" x="282" y="731">Maximum-sized allocation bitmap</text><rect x="42" y="766" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="804">34–101</text><text class="small" x="282" y="804">Fixed administrative overlay cache</text><rect x="42" y="839" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="877">102 onward</text><text class="small" x="282" y="877">Database allocator, below journal/caches</text><rect x="42" y="912" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="950">16 pages</text><text class="small" x="282" y="950">Statement-journal before-images</text><rect x="42" y="985" width="676" height="63" rx="5" fill="#203e3b"/><text class="mono" x="58" y="1023">Top 544 pages</text><text class="small" x="282" y="1023">Eight 68-page execution-overlay caches</text><text class="small" x="42" y="1102">The detailed map records exact current code/BSS ends.</text></svg>