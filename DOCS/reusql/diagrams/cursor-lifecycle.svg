<svg xmlns="http://www.w3.org/2000/svg" width="760" height="745" viewBox="0 0 760 745" role="img" aria-labelledby="title desc">
<title id="title">One cursor, streamed values</title><desc id="desc">Open a query, advance through its rows, inspect the columns and read variable-value slices, then close the cursor. The interface is single-cursor and non-reentrant.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ed9d0"/></marker></defs>
<rect width="760" height="745" rx="18" fill="#101e2c"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#e8f2f4}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#b8cbd6}.mono{font:20px ui-monospace,Consolas,monospace;fill:#8de1d9}.arrow{fill:none;stroke:#6ed9d0;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="46">One cursor, streamed values</text>
<rect x="42" y="80" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="115">Open the query</text><text class="small" x="64" y="147">rsql_query_open: bind the SELECT and get a cursor</text><path class="arrow" d="M380 174V198"/><rect x="42" y="202" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="237">Advance to a row</text><text class="small" x="64" y="269">rsql_cursor_next: check has_row</text><path class="arrow" d="M380 296V320"/><rect x="42" y="324" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="359">Inspect a column</text><text class="small" x="64" y="391">rsql_cursor_column: type, NULL state, logical length</text><path class="arrow" d="M380 418V442"/><rect x="42" y="446" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="481">Read value slices as needed</text><text class="small" x="64" y="513">rsql_value_read: bounded TEXT/BLOB/scalar chunks</text><path class="arrow" d="M380 540V564"/><rect x="42" y="568" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="603">Repeat, then close the query</text><text class="small" x="64" y="635">rsql_query_close: release the active cursor</text><text class="small" x="42" y="710">One active cursor. Do not overlap or re-enter requests.</text></svg>