<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
<title id="title">Seven explicit stages, smaller inputs</title><desc id="desc">The benchmark filters into a TEMP table, creates an index, joins customers into another TEMP table, indexes it, joins products into a third TEMP table, indexes it, then groups and sorts the final result. These are explicit SQL stages, not an optimizer plan.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ed9d0"/></marker></defs>
<rect width="760" height="740" rx="18" fill="#101e2c"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#e8f2f4}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#b8cbd6}.mono{font:20px ui-monospace,Consolas,monospace;fill:#8de1d9}.arrow{fill:none;stroke:#6ed9d0;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="46">Seven explicit stages, smaller inputs</text>
<rect x="42" y="82" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="117">1  Filter and project orders</text><text class="small" x="64" y="149">FILTERED_ORDERS: only required rows and columns</text><path class="arrow" d="M690 176V228"/><text class="mono" x="42" y="212">2  Index (C2, C3): customer and product</text><rect x="42" y="232" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="267">3  Join the customer table</text><text class="small" x="64" y="299">CUSTOMER_SALES: add region; keep narrow rows</text><path class="arrow" d="M690 326V378"/><text class="mono" x="42" y="362">4  Index (C2, C5): product and region</text><rect x="42" y="382" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="417">5  Join the product table</text><text class="small" x="64" y="449">READY_SALES: total, item count, region, category</text><path class="arrow" d="M690 476V528"/><text class="mono" x="42" y="512">6  Index (C3, C4): region and category</text><rect x="42" y="532" width="676" height="94" rx="10" fill="#21463e" stroke="#486477"/><text class="label" x="64" y="567">7  Group, aggregate and order</text><text class="small" x="64" y="599">COUNT · SUM · AVG · MIN · MAX</text><text class="small" x="42" y="672">Each TEMP boundary stores work for subsequent statements.</text><text class="small" x="42" y="705">Measured full pipeline: 425.88 s PAL, including all seven steps.</text></svg>