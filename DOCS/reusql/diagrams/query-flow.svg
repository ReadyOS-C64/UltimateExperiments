<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">A query moves through owned phases</title><desc id="desc">The client calls the resident coordinator. Query phases share one active overlay window, and the REU holds rows, values, caches and journal pages. Result shaping can replay the producer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ed9d0"/></marker></defs>
<rect width="760" height="680" rx="18" fill="#101e2c"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#e8f2f4}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#b8cbd6}.mono{font:20px ui-monospace,Consolas,monospace;fill:#8de1d9}.arrow{fill:none;stroke:#6ed9d0;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="46">A query moves through owned phases</text>
<rect x="42" y="78" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="113">C64 client: shell or application</text><text class="small" x="64" y="145">SQL request in · cursor rows and value slices out</text><path class="arrow" d="M380 172V206"/><rect x="42" y="210" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="245">Resident coordinator</text><text class="small" x="64" y="277">Owns DMA, journals, phase switches and public ABI</text><path class="arrow" d="M380 304V338"/><rect x="42" y="342" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="377">One active 17 KB overlay window</text><text class="small" x="64" y="409">Parse · bind · scan/join · compare · aggregate</text><path class="arrow" d="M380 436V470"/><rect x="42" y="474" width="676" height="94" rx="10" fill="#1e3548" stroke="#486477"/><text class="label" x="64" y="509">REU: database pages and cached overlays</text><text class="small" x="64" y="541">Rows, TEXT/BLOB chains, indexes and before-images</text><path class="arrow" d="M710 426Q744 426 744 370V326Q744 286 710 286"/><text class="small" x="42" y="615">ORDER BY / DISTINCT / GROUP BY may replay the producer.</text><text class="small" x="42" y="647">Small memory footprint can mean repeated relationship walks.</text></svg>