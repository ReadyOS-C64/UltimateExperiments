FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__:     type = weak, value = $D000;
    __OVERLAYSTART__: type = export, value = $B600;
    # Cache the complete code + constants + BSS payload, not code alone.
    __OVERLAY1_LOAD__: type = export, value = __OVL1_START__;
    __OVERLAY1_SIZE__: type = export, value = __OVL1_LAST__ - __OVL1_START__;
    __OVERLAY2_SIZE__: type = export, value = __OVL2_LAST__ - __OVL2_START__;
    __OVERLAY3_SIZE__: type = export, value = __OVL3_LAST__ - __OVL3_START__;
    __OVERLAY4_SIZE__: type = export, value = __OVL4_LAST__ - __OVL4_START__;
    __OVERLAY5_SIZE__: type = export, value = __OVL5_LAST__ - __OVL5_START__;
    __OVERLAY6_SIZE__: type = export, value = __OVL6_LAST__ - __OVL6_START__;
    __OVERLAY7_SIZE__: type = export, value = __OVL7_LAST__ - __OVL7_START__;
    __OVERLAY8_SIZE__: type = export, value = __OVL8_LAST__ - __OVL8_START__;
    __OVERLAY9_SIZE__: type = export, value = __OVL9_LAST__ - __OVL9_START__;
    __OVERLAY10_SIZE__: type = export, value = __OVL10_LAST__ - __OVL10_START__;
    __OVERLAY11_SIZE__: type = export, value = __OVL11_LAST__ - __OVL11_START__;
    __OVERLAY12_SIZE__: type = export, value = __OVL12_LAST__ - __OVL12_START__;
    __OVERLAY13_SIZE__: type = export, value = __OVL13_LAST__ - __OVL13_START__;
    __OVERLAY14_SIZE__: type = export, value = __OVL14_LAST__ - __OVL14_START__;
    __OVERLAY15_SIZE__: type = export, value = __OVL15_LAST__ - __OVL15_START__;
    __OVERLAY16_SIZE__: type = export, value = __OVL16_LAST__ - __OVL16_START__;
    __OVERLAY17_SIZE__: type = export, value = __OVL17_LAST__ - __OVL17_START__;
    __OVERLAY20_SIZE__: type = export, value = __OVL20_LAST__ - __OVL20_START__;
    __OVERLAY19_SIZE__: type = export, value = __OVL19_LAST__ - __OVL19_START__;
    __OVERLAY18_SIZE__: type = export, value = __OVL18_LAST__ - __OVL18_START__;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    HEADER:   file = %O, define = yes, start = %S, size = $000D;
    # C64 crt0 initializes the cc65 software stack from MAIN start+size. Keep
    # its top at $D000: ending MAIN at the overlay start made deep recursive
    # failure paths grow down from $B600 and overwrite resident BSS. Loaded
    # MAIN segments still end below $B600; the separate overlay memories own
    # $B600-$C5FF and the live stack remains above the ReadyOS shim window.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__,
              size = __HIMEM__ - __HEADER_LAST__;
    # Preserve cc65 ONCE exactly; resident BSS must stop before the overlay.
    BSS:      file = "", start = __ONCE_RUN__ + __ONCE_SIZE__,
              size = __OVERLAYSTART__ - (__ONCE_RUN__ + __ONCE_SIZE__);
    OVL1ADDR: file = "artifacts/readyfs/readyfs-match.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL1:     define = yes, file = "artifacts/readyfs/readyfs-match.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL2ADDR: file = "artifacts/readyfs/readyfs-plan.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL2:     define = yes, file = "artifacts/readyfs/readyfs-plan.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL3ADDR: file = "artifacts/readyfs/readyfs-help.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL3:     define = yes, file = "artifacts/readyfs/readyfs-help.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL4ADDR: file = "artifacts/readyfs/readyfs-backend.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL4:     define = yes, file = "artifacts/readyfs/readyfs-backend.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL5ADDR: file = "artifacts/readyfs/readyfs-cmdpath.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL5:     define = yes, file = "artifacts/readyfs/readyfs-cmdpath.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL6ADDR: file = "artifacts/readyfs/readyfs-drive.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL6:     define = yes, file = "artifacts/readyfs/readyfs-drive.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL7ADDR: file = "artifacts/readyfs/readyfs-utility.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL7:     define = yes, file = "artifacts/readyfs/readyfs-utility.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL8ADDR: file = "artifacts/readyfs/readyfs-tree.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL8:     define = yes, file = "artifacts/readyfs/readyfs-tree.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL9ADDR: file = "artifacts/readyfs/readyfs-content.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL9:     define = yes, file = "artifacts/readyfs/readyfs-content.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL10ADDR: file = "artifacts/readyfs/readyfs-batch.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL10:    define = yes, file = "artifacts/readyfs/readyfs-batch.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL11ADDR: file = "artifacts/readyfs/readyfs-recursive.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL11:    define = yes, file = "artifacts/readyfs/readyfs-recursive.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL12ADDR: file = "artifacts/readyfs/readyfs-tape.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL12:    define = yes, file = "artifacts/readyfs/readyfs-tape.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL20ADDR: file = "artifacts/readyfs/readyfs-files-plan.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL20: define = yes, file = "artifacts/readyfs/readyfs-files-plan.prg", start = __OVERLAYSTART__, size = $1000;
    OVL19ADDR: file = "artifacts/readyfs/readyfs-files.prg",
              start = __OVERLAYSTART__ - 2, size = $0002;
    OVL19:    define = yes, file = "artifacts/readyfs/readyfs-files.prg",
              start = __OVERLAYSTART__, size = $1000;
    OVL18ADDR: file = "artifacts/readyfs/readyfs-native.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL18: define = yes, file = "artifacts/readyfs/readyfs-native.prg", start = __OVERLAYSTART__, size = $1000;
    OVL17ADDR: file = "artifacts/readyfs/readyfs-iec.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL17: define = yes, file = "artifacts/readyfs/readyfs-iec.prg", start = __OVERLAYSTART__, size = $1000;
    OVL16ADDR: file = "artifacts/readyfs/readyfs-stream.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL16: define = yes, file = "artifacts/readyfs/readyfs-stream.prg", start = __OVERLAYSTART__, size = $1000;
    OVL15ADDR: file = "artifacts/readyfs/readyfs-command-help.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL15: define = yes, file = "artifacts/readyfs/readyfs-command-help.prg", start = __OVERLAYSTART__, size = $1000;
    OVL14ADDR: file = "artifacts/readyfs/readyfs-present.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL14: define = yes, file = "artifacts/readyfs/readyfs-present.prg", start = __OVERLAYSTART__, size = $1000;
    OVL13ADDR: file = "artifacts/readyfs/readyfs-ui.prg", start = __OVERLAYSTART__ - 2, size = $0002;
    OVL13: define = yes, file = "artifacts/readyfs/readyfs-ui.prg", start = __OVERLAYSTART__, size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER, type = ro;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    INIT:     load = MAIN, type = rw;
    ONCE:     load = MAIN, type = ro, define = yes;
    BSS:      load = BSS, type = bss, define = yes;
    OVL1ADDR: load = OVL1ADDR, type = ro;
    # Never merge assembler code/RODATA/BSS names. cc65 emits constants
    # inside .proc before switching back to code; merging makes them executable.
    OVERLAY1: load = OVL1, type = ro;
    OVERLAY1R: load = OVL1, type = ro, optional = yes;
    OVERLAY1B: load = OVL1, type = ro, optional = yes;
    OVL2ADDR: load = OVL2ADDR, type = ro;
    OVERLAY2: load = OVL2, type = ro;
    OVERLAY2R: load = OVL2, type = ro, optional = yes;
