version: 1
kind: vice_task_plan
plan_id: readyfs_ui_find_ring
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params: { kill_stale: true }
  - id: ready
    type: screen.wait_contains
    params: { text: "UP/DN HIST", wait_timeout_s: 60 }
  - id: find
    type: input.sequence
    params: { keys: [70, 73, 32, 56, 58, 47, 32, 45, 73, 32, 82, 70, 86, 73, 69, 87, 13], inter_key_delay_s: 0.08, post_delay_s: 0.5 }
  - id: find_capture
    type: screen.capture
    params: { label: find_capture }
  - id: find_ok
    type: screen.wait_contains
    params: { text: "FIND DONE", wait_timeout_s: 20, capture_label: find_ok }
  - id: ring
    type: input.sequence
    params: { keys: [67, 76, 13, 82, 85, 32, 56, 58, 47, 82, 70, 82, 73, 78, 71, 13], inter_key_delay_s: 0.08, post_delay_s: 1 }
  - id: ring_capture
    type: screen.capture
    params: { label: ring_capture }
  - id: ring_ok
    type: screen.wait_contains
    params: { text: "COMMANDS 900 RC 0", wait_timeout_s: 120, capture_label: ring_ok }
