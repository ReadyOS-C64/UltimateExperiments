version: 1
kind: vice_task_plan
plan_id: readyfs_content_views
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 60, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params: { kill_stale: true }
  - id: ready
    type: screen.wait_contains
    params: { text: "CMDPATH: READY", wait_timeout_s: 30 }
  - id: crc32_input
    type: input.sequence
    params: { keys: [67,82,67,51,50,32,56,58,47,82,70,86,73,69,87,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: crc32_result
    type: screen.wait_contains
    params: { text: "CRC32 $6126E7F6", wait_timeout_s: 15, capture_label: readyfs_crc32_stream }
  - id: clear
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.25 }
  - id: head_input
    type: input.sequence
    params: { keys: [72,69,65,68,32,56,58,47,82,70,86,73,69,87,32,51,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: head_result
    type: screen.wait_contains
    params: { text: "HEAD; READ 32 BYTES", wait_timeout_s: 15, capture_label: readyfs_content_head_regression }
  - id: clear_tail
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.25 }
  - id: tail_input
    type: input.sequence
    params: { keys: [84,65,73,76,32,56,58,47,82,70,76,79,78,71,32,50,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: tail_last
    type: screen.wait_contains
    params: { text: "LONG20-ABCDEFGHIJ", wait_timeout_s: 15 }
  - id: tail_truncated
    type: screen.wait_contains
    params: { text: "TAIL TRUNCATED", wait_timeout_s: 15, capture_label: readyfs_content_tail_regression }
  - id: clear_test_list
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.25 }
  - id: test_list_input
    type: input.sequence
    params: { keys: [84,69,83,84,13], inter_key_delay_s: 0.04, post_delay_s: 0.35 }
  - id: test_list_observed
    type: screen.capture
    params: { capture_label: readyfs_test_list_observed }
  - id: test_list_version
    type: screen.wait_contains
    params: { text: "RFT1 SUITES", wait_timeout_s: 10 }
  - id: test_list_core
    type: screen.wait_contains
    params: { text: "CORE", wait_timeout_s: 10, capture_label: readyfs_test_list }
  - id: clear_test_run
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.25 }
  - id: test_run_input
    type: input.sequence
    params: { keys: [84,69,83,84,13], inter_key_delay_s: 0.04, post_delay_s: 0.35 }
  - id: test_run_result
    type: screen.wait_contains
    params: { text: "RFT1 CORE PASS 4/4", wait_timeout_s: 10, capture_label: readyfs_test_core_pass }
