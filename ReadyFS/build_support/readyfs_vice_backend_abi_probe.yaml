version: 1
kind: vice_task_plan
plan_id: readyfs_backend_abi_probe
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs_overlay
    type: vice.launch
    params: { kill_stale: true }
  - id: backend_abi_ready
    type: screen.wait_contains
    params: { text: "BACKEND: READY", wait_timeout_s: 30, capture_label: readyfs_backend_abi_boot }
  - id: dump_backend_abi_boundary
    type: dump.memory_ranges
    params:
      ranges:
        - { label: zero_page_runtime, start: 0x0000, end: 0x001B }
        - { label: resident_bss_tail, start: 0xB560, end: 0xB5FF }
        - { label: shared_overlay_window, start: 0xB600, end: 0xC5FF }
  - id: backend_abi_registers
    type: monitor.command
    params: { command: "r" }
  - id: match_after_backend_abi_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,46,80,82,71,32,65,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: match_after_backend_abi
    type: screen.wait_contains
    params: { text: "MATCH: YES", wait_timeout_s: 10, capture_label: readyfs_backend_abi_match }
