version: 1
kind: vice_task_plan
plan_id: readyfs_recursive_plan
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: create_one_input
    type: input.sequence
    params: { keys: [78,69,87,32,56,58,47,79,78,69,46,80,82,71,32,45,45,84,89,80,69,32,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: create_one
    type: screen.wait_contains
    params: { text: "CREATED", wait_timeout_s: 30 }
  - id: create_two_input
    type: input.sequence
    params: { keys: [78,69,87,32,56,58,47,84,87,79,46,83,69,81,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: create_two
    type: screen.wait_contains
    params: { text: "CREATED", wait_timeout_s: 30 }
  - id: create_skip_input
    type: input.sequence
    params: { keys: [78,69,87,32,56,58,47,83,75,73,80,46,85,83,82,32,45,45,84,89,80,69,32,85,83,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: create_skip
    type: screen.wait_contains
    params: { text: "CREATED", wait_timeout_s: 30 }
  - id: recursive_copy_include_input
    type: input.sequence
    params: { keys: [67,79,80,89,32,56,58,47,32,57,58,47,32,45,45,82,69,67,85,82,83,73,86,69,32,45,45,68,82,89,45,82,85,78,32,45,45,73,78,67,76,85,68,69,32,42,46,80,82,71,13], inter_key_delay_s: 0.03, post_delay_s: 0.5 }
  - id: capture_recursive_copy_debug
    type: screen.capture
    params: { label: recursive_copy_debug }
  - id: recursive_copy_count
    type: screen.wait_contains
    params: { text: "RECURSIVE PLAN F4 D0 SELECTED 1", wait_timeout_s: 30 }
  - id: recursive_copy_plan
    type: screen.wait_contains
    params: { text: "PLAN W1 D0 M0; DONE W0 D0 M0", wait_timeout_s: 10, capture_label: rf_ui_recursive_copy_include }
  - id: recursive_delete_exclude_input
    type: input.sequence
    params: { keys: [68,69,76,69,84,69,32,56,58,47,32,45,45,82,69,67,85,82,83,73,86,69,32,45,45,87,72,65,84,73,70,32,45,45,69,88,67,76,85,68,69,32,42,46,80,82,71,13], inter_key_delay_s: 0.03, post_delay_s: 0.5 }
  - id: recursive_delete_count
    type: screen.wait_contains
    params: { text: "RECURSIVE PLAN F4 D0 SELECTED 3", wait_timeout_s: 30 }
  - id: recursive_delete_plan
    type: screen.wait_contains
    params: { text: "PLAN W0 D3 M0; DONE W0 D0 M0", wait_timeout_s: 10, capture_label: rf_ui_recursive_delete_exclude }
  - id: recursive_move_include_input
    type: input.sequence
    params: { keys: [77,79,86,69,32,56,58,47,32,57,58,47,32,45,45,82,69,67,85,82,83,73,86,69,32,45,45,68,82,89,45,82,85,78,32,45,45,73,78,67,76,85,68,69,32,79,78,69,46,42,13], inter_key_delay_s: 0.03, post_delay_s: 0.5 }
  - id: recursive_move_count
    type: screen.wait_contains
    params: { text: "RECURSIVE PLAN F4 D0 SELECTED 1", wait_timeout_s: 30 }
