    type: screen.wait_contains
    params: { text: "PLAN W1 D1 M0; DONE W0 D0 M0", wait_timeout_s: 10, capture_label: rf_ui_recursive_move_include }
  - id: recursive_actual_rejected_input
    type: input.sequence
    params: { keys: [68,69,76,69,84,69,32,56,58,47,32,45,45,82,69,67,85,82,83,73,86,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
