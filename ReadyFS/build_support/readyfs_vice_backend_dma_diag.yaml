version: 1
kind: vice_task_plan
plan_id: readyfs_backend_dma_diag
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 30, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs_overlay
    type: vice.launch
    params: { kill_stale: true }
  - id: backend_dma_ready
    type: screen.wait_contains
    params: { text: "BACKEND: READY", wait_timeout_s: 30, capture_label: readyfs_backend_dma_ready }
  - id: settle_backend_dma
    type: monitor.command
    params: { command: "r" }
  - id: dump_backend_dma_state
    type: dump.memory_ranges
    params:
      ranges:
        - { label: zero_page_runtime, start: 0x0000, end: 0x001B }
        - { label: kernal_cursor, start: 0x00D0, end: 0x00D9 }
        - { label: reu_registers, start: 0xDF00, end: 0xDF0F }
        - { label: overlay_head, start: 0xB600, end: 0xB6FF }
  - id: capture_backend_dma_screen
    type: screen.capture
    params: { label: readyfs_backend_dma_diag }
