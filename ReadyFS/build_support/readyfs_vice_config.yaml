version: 1
kind: vice_task_plan
plan_id: readyfs_config_roundtrip
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: set_saved_alias_input
    type: input.sequence
    params: { keys: [65,76,73,65,83,32,87,79,82,75,32,85,58,47,85,83,66,49,47,79,82,73,71,73,78,65,76,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: set_saved_alias
    type: screen.wait_contains
    params: { text: "ALIAS SET", wait_timeout_s: 10 }
  - id: set_saved_cwd_input
    type: input.sequence
    params: { keys: [67,68,32,85,58,47,85,83,66,49,47,83,65,86,69,68,67,87,68,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: config_save_input
    type: input.sequence
    params: { keys: [67,79,78,70,73,71,32,83,65,86,69,32,56,58,47,82,70,67,70,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: config_save
    type: screen.wait_contains
    params: { text: "CONFIG SAVED AND VERIFIED", wait_timeout_s: 60, capture_label: readyfs_config_save }
  - id: clear_before_mutate_session
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: mutate_session_input
    type: input.sequence
    params: { keys: [85,78,65,76,73,65,83,32,87,79,82,75,13,67,68,32,56,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: config_load_input
    type: input.sequence
    params: { keys: [67,79,78,70,73,71,32,76,79,65,68,32,56,58,47,82,70,67,70,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: config_load
    type: screen.wait_contains
    params: { text: "CONFIG LOADED", wait_timeout_s: 60 }
  - id: config_pwd_input
    type: input.sequence
    params: { keys: [80,87,68,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: config_cwd_restored
    type: screen.wait_contains
    params: { text: "U:/USB1/SAVEDCWD", wait_timeout_s: 10 }
  - id: config_alias_input
    type: input.sequence
    params: { keys: [65,76,73,65,83,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: config_alias_restored
    type: screen.wait_contains
    params: { text: "@WORK: U:/USB1/ORIGINAL", wait_timeout_s: 10, capture_label: readyfs_config_load_roundtrip }
  - id: clear_before_config_cleanup
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: config_cleanup_input
    type: input.sequence
    params: { keys: [68,69,76,69,84,69,32,56,58,47,82,70,67,70,71,32,45,45,70,79,82,67,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: config_cleanup
    type: screen.wait_contains
    params: { text: "DELETED", wait_timeout_s: 20, capture_label: readyfs_config_cleanup }

