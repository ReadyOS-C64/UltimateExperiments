version: 1
kind: vice_task_plan
plan_id: readyfs_iec_copy_move
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: seed_source_input
    type: input.sequence
    params: { keys: [87,82,73,84,69,32,56,58,47,83,82,67,32,34,67,79,80,89,32,80,65,89,76,79,65,68,34,32,45,45,76,73,78,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: seed_source_complete
    type: screen.wait_contains
    params: { text: "WRITE COMPLETE", wait_timeout_s: 45 }
  - id: clear_before_copy_dry_run
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_50_copy_dry_run_input
    type: input.sequence
    params: { keys: [67,79,80,89,32,56,58,47,83,82,67,32,56,58,47,68,82,89,67,79,80,89,32,45,45,68,82,89,45,82,85,78,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
