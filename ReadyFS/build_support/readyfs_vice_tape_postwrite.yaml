version: 1
kind: vice_task_plan
plan_id: readyfs_tape_postread_iec_write
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 180, read_s: 3 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: "artifacts/readyfs/readyfs-tape-target.d64"
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive8_enabled: true
    drive9_type: 1541
    drive9_enabled: true
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params: { kill_stale: true }
  - id: ready
    type: screen.wait_contains
    params: { text: "CMDPATH: READY", wait_timeout_s: 30 }
  - id: control_write_before_tape
    type: input.sequence
    params: { keys: [87,82,73,84,69,32,57,58,47,66,69,70,79,82,69,32,83,65,70,69,32,45,45,76,73,78,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: control_write_result
    type: screen.wait_contains
    params: { text: "WRITE COMPLETE", wait_timeout_s: 60, capture_label: readyfs_tape_control_iec_write }
  - id: attach_recorded_tap
    type: monitor.command
    params: { command: 'raw: attach "artifacts/readyfs/readyfs-tape-test.tap" 1' }
  - id: rewind
    type: monitor.command
    params: { command: "raw: tapeoffs 0" }
  - id: type_second_record
    type: input.sequence
    params: { keys: [84,89,80,69,32,84,58,47,82,70,67,79,80,89,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: play_prompt
    type: screen.wait_contains
    params: { text: "PRESS PLAY", wait_timeout_s: 30 }
  - id: play
    type: monitor.command
    params: { command: "raw: tapectrl 1" }
  - id: type_page_full
    type: screen.wait_contains
    params: { text: "VIEW12", wait_timeout_s: 180 }
  - id: type_page_continue
    type: input.key
    params: { key: 32, post_delay_s: 0.4 }
  - id: type_result
    type: screen.wait_contains
    params: { text: "CONTINUED", wait_timeout_s: 30 }
  - id: stop
    type: monitor.command
    params: { command: "raw: tapectrl 0" }
  - id: write_after_tape
    type: input.sequence
    params: { keys: [87,82,73,84,69,32,57,58,47,65,70,84,69,82,32,83,65,70,69,32,45,45,76,73,78,69,13], inter_key_delay_s: 0.04, post_delay_s: 2.0 }
  - id: capture_write_result
    type: screen.capture
    params: { label: readyfs_tape_postread_write_result, note: "Disk write immediately after closed tape read" }
  - id: write_verify
    type: screen.wait_contains
    params: { text: "VERIFY: IDENTICAL", wait_timeout_s: 60 }
  - id: write_result
    type: screen.wait_contains
    params: { text: "WRITE COMPLETE", wait_timeout_s: 30, capture_label: readyfs_tape_postread_iec_write }
  - id: detach
    type: monitor.command
    params: { command: "raw: detach 1" }
