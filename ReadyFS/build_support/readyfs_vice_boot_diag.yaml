version: 1
kind: vice_task_plan
plan_id: readyfs_boot_diag
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs_overlay
    type: vice.launch
    params: { kill_stale: true }
  - id: title_visible
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 10, capture_label: readyfs_boot_diag_title }
  - id: allow_overlay_init
    type: screen.wait_contains
    params: { text: "CMDPATH: READY", wait_timeout_s: 30, capture_label: readyfs_boot_diag_ready }
  - id: boot_registers
    type: monitor.command
    params: { command: "r" }
  - id: boot_memory
    type: dump.memory_ranges
    params:
      ranges:
        - { label: resident_tail, start: 0xB560, end: 0xB5FF }
        - { label: overlay_window, start: 0xB600, end: 0xC5FF }
        - { label: reu_registers, start: 0xDF00, end: 0xDF0F }
