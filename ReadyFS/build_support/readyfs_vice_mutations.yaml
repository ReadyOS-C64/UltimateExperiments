  - id: clear_before_delete_prompt
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_46_delete_no_input
    type: input.sequence
    params: { keys: [68,69,76,69,84,69,32,56,58,47,72,69,76,76,79,13,78], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: rf_ui_46_delete_no_dir_input
    type: input.sequence
    params: { keys: [68,73,82,32,56,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: rf_ui_46_delete_no
    type: screen.wait_contains
    params: { text: "HELLO", wait_timeout_s: 30, capture_label: rf_ui_46_delete_no }
  - id: rf_ui_46_delete_force_input
    type: input.sequence
    params: { keys: [68,69,76,69,84,69,32,56,58,47,72,69,76,76,79,32,45,45,70,79,82,67,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
