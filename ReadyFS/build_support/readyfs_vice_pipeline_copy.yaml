version: 1
kind: vice_task_plan
plan_id: readyfs_pipeline_copy
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs_overlay
    type: vice.launch
    params: { kill_stale: true }
  - id: pipeline_ready
    type: screen.wait_contains
    params: { text: "BACKEND: READY", wait_timeout_s: 30 }
  - id: five_action_controller_ready
    type: screen.wait_contains
    params: { text: "PLANNER: READY", wait_timeout_s: 10, capture_label: rf_ui_134_five_action_ready }
  - id: rf_ui_121_cmdpath_runtime_ready
    type: screen.wait_contains
    params: { text: "CMDPATH: READY", wait_timeout_s: 10, capture_label: rf_ui_121_cmdpath_runtime_ready }
  - id: rf_ui_116_pipeline_copy_input
    type: input.sequence
    params: { keys: [67,79,80,89,32,56,58,47,82,70,77,65,84,67,72,32,56,58,47,82,70,80,73,80,69,32,45,45,70,79,82,67,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: pipeline_copy_state
    type: screen.capture
    params: { label: readyfs_pipeline_copy_state }
  - id: rf_ui_116_pipeline_copy_complete
    type: screen.wait_contains
    params: { text: "COPIED", wait_timeout_s: 60, capture_label: rf_ui_116_pipeline_copy_complete }
  - id: rf_ui_119_match_after_copy_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,46,80,82,71,32,65,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_119_match_after_copy_ready
    type: screen.wait_contains
    params: { text: "MATCH: YES", wait_timeout_s: 10, capture_label: rf_ui_119_match_after_copy }
  - id: rf_ui_117_pipeline_stat_input
    type: input.sequence
    params: { keys: [83,84,65,84,32,56,58,47,82,70,80,73,80,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: rf_ui_117_pipeline_stat_name
    type: screen.wait_contains
    params: { text: "DISPLAY: RFPIPE", wait_timeout_s: 20, capture_label: rf_ui_117_pipeline_stat }
  - id: rf_ui_118_pipeline_compare_input
    type: input.sequence
    params: { keys: [67,79,77,80,65,82,69,32,56,58,47,82,70,77,65,84,67,72,32,56,58,47,82,70,80,73,80,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: rf_ui_118_pipeline_compare_equal
    type: screen.wait_contains
    params: { text: "VERIFY: IDENTICAL", wait_timeout_s: 30, capture_label: rf_ui_118_pipeline_compare }
  - id: clear_before_final_match
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_120_match_after_pipeline_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,46,80,82,71,32,65,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: match_after_pipeline_state
    type: screen.capture
    params: { label: readyfs_match_after_pipeline_state }
  - id: rf_ui_120_match_after_pipeline_ready
    type: screen.wait_contains
    params: { text: "MATCH: YES", wait_timeout_s: 10, capture_label: rf_ui_120_match_after_pipeline }
  - id: dump_pipeline_reu
    type: dump.reu
    params: { stage_tag: readyfs_pipeline_copy, mode: full }
  - id: dump_pipeline_boundaries
    type: dump.memory_ranges
    params:
      ranges:
        - { label: resident_tail, start: 0xB580, end: 0xB5FF }
        - { label: shared_overlay_window, start: 0xB600, end: 0xC5FF }
