version: 1
kind: vice_task_plan
plan_id: readyfs_reu_scrollback
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "UP/DN HIST", wait_timeout_s: 60 }
  - id: seed_old_page_input
    type: input.sequence
    params: { keys: [72, 69, 76, 80, 13, 83, 69, 69, 68, 48, 49, 13, 83, 69, 69, 68, 48, 50, 13, 83, 69, 69, 68, 48, 51, 13, 83, 69, 69, 68, 48, 52, 13, 83, 69, 69, 68, 48, 53, 13, 83, 69, 69, 68, 48, 54, 13, 83, 69, 69, 68, 48, 55, 13, 83, 69, 69, 68, 48, 56, 13, 83, 69, 69, 68, 48, 57, 13, 83, 69, 69, 68, 49, 48, 13, 83, 69, 69, 68, 49, 49, 13, 83, 69, 69, 68, 49, 50, 13, 67, 76, 69, 65, 82, 13], inter_key_delay_s: 0.05, post_delay_s: 0.4 }
  - id: seed_new_page_input
    type: input.sequence
    params: { keys: [80,87,68,13,67,76,69,65,82,13], inter_key_delay_s: 0.05, post_delay_s: 0.4 }
  - id: rf_ui_11_page_up_newer_input
    type: input.sequence
    params: { keys: [133], inter_key_delay_s: 0.05, post_delay_s: 0.3 }
  - id: rf_ui_11_page_up_newer
    type: screen.wait_contains
    params: { text: "8:/", wait_timeout_s: 10, capture_label: rf_ui_11_page_up_newer }
  - id: rf_ui_11_page_up_older_input
    type: input.sequence
    params: { keys: [133], inter_key_delay_s: 0.05, post_delay_s: 0.3 }
  - id: rf_ui_11_page_up_older
    type: screen.wait_contains
    params: { text: "PROBE ALL", wait_timeout_s: 10, capture_label: rf_ui_11_page_up_older }
  - id: rf_ui_11_page_down_newer_input
    type: input.sequence
    params: { keys: [134], inter_key_delay_s: 0.05, post_delay_s: 0.3 }
  - id: rf_ui_11_page_down_newer
    type: screen.wait_contains
    params: { text: "8:/", wait_timeout_s: 10, capture_label: rf_ui_11_page_down_newer }
  - id: rf_ui_11_page_down_live_input
    type: input.sequence
    params: { keys: [134], inter_key_delay_s: 0.05, post_delay_s: 0.3 }
  - id: rf_ui_11_page_down_live
    type: screen.wait_contains
    params: { text: "RF>", wait_timeout_s: 10, capture_label: rf_ui_11_page_down_live }
