version: 1
kind: vice_task_plan
plan_id: readyfs_volume_free
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: rf_ui_31_dir_free_input
    type: input.sequence
    params: { keys: [68,73,82,32,56,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 1.0 }
  - id: rf_ui_31_dir_free
    type: screen.wait_contains
    params: { text: "C64 BLOCKS", wait_timeout_s: 20, capture_label: rf_ui_31_dir_free }
  - id: clear_for_volume
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 1.0 }
  - id: clear_for_volume_ready
    type: screen.wait_contains
    params: { text: "RF>", wait_timeout_s: 10, capture_label: rf_ui_34_clear_ready }
  - id: rf_ui_34_iec_volume_input
    type: input.sequence
    params: { keys: [86,79,76,85,77,69,32,56,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_34_iec_volume
    type: screen.wait_contains
    params: { text: "BACKEND: IEC DEVICE 8", wait_timeout_s: 20, capture_label: rf_ui_34_iec_volume }
  - id: rf_ui_34_ultimate_units_input
    type: input.sequence
    params: { keys: [70,82,69,69,32,85,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_34_ultimate_units
    type: screen.wait_contains
    params: { text: "ULTIMATE DOS", wait_timeout_s: 10, capture_label: rf_ui_34_ultimate_units }
  - id: clear_for_tape
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 1.0 }
  - id: rf_ui_34_tape_units_input
    type: input.sequence
    params: { keys: [86,79,76,85,77,69,32,84,58,47,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_34_tape_units
    type: screen.wait_contains
    params: { text: "NO TAPE FREE", wait_timeout_s: 10, capture_label: rf_ui_34_tape_units }
