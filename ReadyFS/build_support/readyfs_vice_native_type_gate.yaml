version: 1
kind: vice_task_plan
plan_id: readyfs_native_type_gate
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-native-type-boot.d71"
    disk9: "artifacts/readyfs/readyfs-native-type-source.d71"
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1571
    drive9_type: 1571
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params: { kill_stale: true }
  - id: ready
    type: screen.wait_contains
    params: { text: "RF>", wait_timeout_s: 30 }
  - id: native_rel_whatif_input
    type: input.sequence
    params: { keys: [67,79,80,89,32,57,58,47,82,70,82,69,76,42,32,56,58,47,32,45,45,78,65,84,73,86,69,45,80,65,84,84,69,82,78,32,45,45,87,72,65,84,73,70,13], inter_key_delay_s: 0.025, post_delay_s: 0.6 }
  - id: native_rel_rejected_before_plan
    type: screen.wait_contains
    params: { text: "UNSUPPORTED", wait_timeout_s: 30, capture_label: rf_ui_native_rel_rejected }
  - id: native_rel_destination_postcheck_input
    type: input.sequence
    params: { keys: [83,84,65,84,32,56,58,47,82,70,82,69,76,46,82,69,76,13], inter_key_delay_s: 0.03, post_delay_s: 0.5 }
  - id: native_rel_destination_absent
    type: screen.wait_contains
    params: { text: "NOT FOUND", wait_timeout_s: 30, capture_label: rf_ui_native_rel_postcheck }
