version: 1
kind: vice_task_plan
plan_id: readyfs_overlay_match
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-overlay-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs_overlay
    type: vice.launch
    params: { kill_stale: true }
  - id: overlay_boot_ready
    type: screen.wait_contains
    params: { text: "OVERLAY: CMDPATH: READY", wait_timeout_s: 30, capture_label: readyfs_overlay_boot }
  - id: overlay_plan_abi
    type: screen.wait_contains
    params: { text: "PLANNER: READY", wait_timeout_s: 10, capture_label: readyfs_overlay_plan_abi }
  - id: overlay_journal_reu
    type: screen.wait_contains
    params: { text: "JOURNAL: READY", wait_timeout_s: 10, capture_label: readyfs_overlay_journal_reu }
  - id: overlay_backend_controller
    type: screen.wait_contains
    params: { text: "BACKEND: READY", wait_timeout_s: 10, capture_label: readyfs_overlay_backend_controller }
  - id: overlay_help_input
    type: input.sequence
    params: { keys: [72,69,76,80,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: overlay_help
    type: screen.wait_contains
    params: { text: "--WHATIF --APPLY --NATIVE-PATTERN", wait_timeout_s: 10, capture_label: readyfs_overlay_help }
  - id: overlay_component_match_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,46,80,82,71,32,72,69,76,76,79,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: overlay_component_match
    type: screen.wait_contains
    params: { text: "MATCH: YES", wait_timeout_s: 10, capture_label: readyfs_overlay_component_match }
  - id: overlay_recursive_match_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,42,47,42,46,80,82,71,32,79,78,69,47,84,87,79,47,72,69,76,76,79,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: overlay_recursive_match
    type: screen.wait_contains
    params: { text: "MATCH: YES", wait_timeout_s: 10, capture_label: readyfs_overlay_recursive_match }
  - id: overlay_component_boundary_input
    type: input.sequence
    params: { keys: [77,65,84,67,72,32,42,46,80,82,71,32,70,79,76,68,69,82,47,72,69,76,76,79,46,80,82,71,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: overlay_component_boundary
    type: screen.wait_contains
    params: { text: "MATCH: NO", wait_timeout_s: 10, capture_label: readyfs_overlay_component_boundary }
