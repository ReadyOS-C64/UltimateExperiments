version: 1
kind: vice_task_plan
plan_id: readyfs_rel_rejection
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-rel-boot.d71"
    disk9: "artifacts/readyfs/readyfs-rel-source.d71"
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1571
    drive9_type: 1571
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params: { kill_stale: true }
  - id: ready
    type: screen.wait_contains
    params: { text: "PLANNER: READY", wait_timeout_s: 30 }
  - id: rel_stat_input
    type: input.sequence
    params: { keys: [83,84,65,84,32,57,58,47,82,70,82,69,76,46,82,69,76,13], inter_key_delay_s: 0.04, post_delay_s: 0.8 }
  - id: rel_stat_name
    type: screen.wait_contains
    params: { text: "DISPLAY: RFREL.REL", wait_timeout_s: 20 }
  - id: rel_stat_type
    type: screen.wait_contains
    params: { text: "TYPE: $13", wait_timeout_s: 20, capture_label: rf_ui_48_rel_source_type }
  - id: clear
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 1.0 }
  - id: cross_backend_copy_input
    type: input.sequence
    params: { keys: [67,79,80,89,32,57,58,47,82,70,82,69,76,46,82,69,76,32,85,58,47,82,69,76,67,79,80,89,13], inter_key_delay_s: 0.04, post_delay_s: 0.8 }
  - id: cross_backend_rel_rejected
    type: screen.wait_contains
    params: { text: "REL UNSUPPORTED", wait_timeout_s: 20, capture_label: rf_ui_48_cross_backend_rel_rejected }
  - id: prompt_returned
    type: screen.wait_contains
    params: { text: "RF>", wait_timeout_s: 10 }
