version: 1
kind: vice_task_plan
plan_id: readyfs_dos_config_fresh
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-dos-test.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs-overlay.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - {"id": "launch", "type": "vice.launch", "params": {"kill_stale": true}}
  - {"id": "ready", "type": "screen.wait_contains", "params": {"text": "UP/DN HIST", "wait_timeout_s": 90}}
  - {"id": "input_clear_initial", "type": "input.sequence", "params": {"keys": [67, 76, 69, 65, 82, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
  - {"id": "input_initial_empty", "type": "input.sequence", "params": {"keys": [69, 67, 72, 79, 32, 73, 78, 73, 84, 73, 65, 76, 32, 91, 37, 83, 65, 86, 69, 68, 37, 93, 32, 91, 37, 80, 82, 73, 86, 65, 84, 69, 37, 93, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
  - {"id": "initial_empty", "type": "screen.wait_contains", "params": {"text": "INITIAL [] []", "wait_timeout_s": 30, "capture_label": "initial_empty"}}
  - {"id": "input_clear_load", "type": "input.sequence", "params": {"keys": [67, 76, 69, 65, 82, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
  - {"id": "input_load_fresh", "type": "input.sequence", "params": {"keys": [67, 79, 78, 70, 73, 71, 32, 76, 79, 65, 68, 32, 56, 58, 47, 82, 70, 66, 69, 78, 86, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
