  - {"id": "input_clear_values", "type": "input.sequence", "params": {"keys": [67, 76, 69, 65, 82, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
  - {"id": "input_echo_fresh", "type": "input.sequence", "params": {"keys": [69, 67, 72, 79, 32, 70, 82, 69, 83, 72, 32, 37, 83, 65, 86, 69, 68, 37, 32, 91, 37, 80, 82, 73, 86, 65, 84, 69, 37, 93, 13], "inter_key_delay_s": 0.025, "post_delay_s": 0.35}}
  - {"id": "fresh_values", "type": "screen.wait_contains", "params": {"text": "FRESH ORIGINAL []", "wait_timeout_s": 30, "capture_label": "fresh_values"}}
