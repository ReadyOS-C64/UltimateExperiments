version: 1
kind: vice_task_plan
plan_id: readyfs_standalone_smoke
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 90, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params:
      text: "READYFS LAB"
      wait_timeout_s: 30
      capture_on_success: true
      capture_label: readyfs_initial
  - id: enter_help
    type: input.sequence
    params:
      keys: [72,69,76,80,13]
      inter_key_delay_s: 0.08
      post_delay_s: 0.5
  - id: assert_help
    type: screen.wait_contains
    params: { text: "PROBE DRIVES CD DIR STAT VOLUME TYPE", wait_timeout_s: 10 }
  - id: clear_before_probe_uci
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.2 }
  - id: rf_ui_25_probe_uci_absent_input
    type: input.sequence
    params: { keys: [80,82,79,66,69,32,85,67,73,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_25_probe_uci_absent
    type: screen.wait_contains
    params: { text: "UCI: OFF", wait_timeout_s: 10, capture_label: rf_ui_25_probe_uci_absent }
  - id: rf_ui_25_probe_uci_prompt
    type: screen.wait_contains
    params: { text: "RF>", wait_timeout_s: 10 }
  - id: enter_path_and_dry_run
    type: input.sequence
    params:
      keys: [67,68,32,85,58,47,85,83,66,49,13,68,69,76,69,84,69,32,85,58,47,85,83,66,49,47,82,69,65,68,89,70,83,45,84,69,83,84,47,88,32,45,45,68,82,89,45,82,85,78,13]
      inter_key_delay_s: 0.04
      post_delay_s: 0.5
  - id: assert_dry_run_no_writes
    type: screen.capture
    params: { label: readyfs_dry_run }
  - id: wait_dry_run_no_writes
    type: screen.wait_contains
    params: { text: "DONE W0 D0 M0", wait_timeout_s: 10, capture_label: readyfs_dry_run_ok }
