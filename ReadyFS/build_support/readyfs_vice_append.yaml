version: 1
kind: vice_task_plan
plan_id: readyfs_iec_append
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: seed_append_file_input
    type: input.sequence
    params: { keys: [87,82,73,84,69,32,56,58,47,65,80,80,69,78,68,70,32,34,79,78,69,34,32,45,45,76,73,78,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: seed_append_file_complete
    type: screen.wait_contains
    params: { text: "WRITE COMPLETE", wait_timeout_s: 45 }
  - id: clear_before_append
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_37_append_input
    type: input.sequence
    params: { keys: [65,80,80,69,78,68,32,56,58,47,65,80,80,69,78,68,70,32,34,84,87,79,34,32,45,45,76,73,78,69,13], inter_key_delay_s: 0.04, post_delay_s: 0.5 }
  - id: rf_ui_37_append_verify
    type: screen.wait_contains
    params: { text: "VERIFY: IDENTICAL", wait_timeout_s: 45 }
  - id: rf_ui_37_append_complete
    type: screen.wait_contains
    params: { text: "APPEND COMPLETE", wait_timeout_s: 10, capture_label: rf_ui_37_append }
  - id: clear_before_type
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rf_ui_37_type_input
    type: input.sequence
    params: { keys: [84,89,80,69,32,56,58,47,65,80,80,69,78,68,70,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: rf_ui_37_type_one
    type: screen.wait_contains
    params: { text: "ONE", wait_timeout_s: 20 }
  - id: rf_ui_37_type_two
    type: screen.wait_contains
    params: { text: "TWO", wait_timeout_s: 20, capture_label: rf_ui_37_append_content }
