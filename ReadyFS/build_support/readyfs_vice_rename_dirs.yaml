version: 1
kind: vice_task_plan
plan_id: readyfs_iec_rename_dirs
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy: { max_attempts: 1, backoff_ms: 250, jitter: false }
  timeouts: { launch_s: 45, step_s: 120, read_s: 2 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  vice:
    disk8: "artifacts/readyfs/readyfs-lab.d81"
    disk9: null
    autostart_prg: "artifacts/readyfs/readyfs.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_readyfs
    type: vice.launch
    params: { kill_stale: true }
  - id: wait_readyfs
    type: screen.wait_contains
    params: { text: "READYFS LAB", wait_timeout_s: 30 }
  - id: seed_rename_source_input
    type: input.sequence
    params: { keys: [87,82,73,84,69,32,56,58,47,82,69,78,79,76,68,32,34,82,69,78,65,77,69,32,80,65,89,76,79,65,68,34,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: seed_rename_source
    type: screen.wait_contains
    params: { text: "WRITE COMPLETE", wait_timeout_s: 45 }
  - id: clear_before_rename
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rename_input
    type: input.sequence
    params: { keys: [82,69,78,65,77,69,32,56,58,47,82,69,78,79,76,68,32,56,58,47,82,69,78,78,69,87,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: rename_complete
    type: screen.wait_contains
    params: { text: "RENAME COMPLETE", wait_timeout_s: 30, capture_label: readyfs_rename }
  - id: clear_before_rename_check
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rename_source_stat_input
    type: input.sequence
    params: { keys: [83,84,65,84,32,56,58,47,82,69,78,79,76,68,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rename_source_absent
    type: screen.wait_contains
    params: { text: "NOT FOUND", wait_timeout_s: 20 }
  - id: rename_dest_stat_input
    type: input.sequence
    params: { keys: [83,84,65,84,32,56,58,47,82,69,78,78,69,87,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: rename_dest_present
    type: screen.wait_contains
    params: { text: "DISPLAY: RENNEW", wait_timeout_s: 20, capture_label: readyfs_rename_postcheck }
  - id: clear_before_mkdir
    type: input.sequence
    params: { keys: [67,76,69,65,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.3 }
  - id: mkdir_input
    type: input.sequence
    params: { keys: [77,75,68,73,82,32,56,58,47,84,69,83,84,68,73,82,13], inter_key_delay_s: 0.04, post_delay_s: 0.4 }
  - id: mkdir_complete
    type: screen.wait_contains
    params: { text: "MKDIR FAILED", wait_timeout_s: 30, capture_label: readyfs_flat_iec_mkdir_rejected }
