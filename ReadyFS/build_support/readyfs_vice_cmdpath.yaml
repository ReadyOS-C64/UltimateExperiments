  # Emulate only the ReadyFS capability cache, not an SD2IEC device.  IEC 8's
  # record is {magic, device, kind, flags} at session offset $0888; the session
  # starts at REU $2000 and the 16 MiB VICE REU history/session bank is $FF.
  # This lets the same plan prove both legacy denial above and compatible-path
  # admission below without claiming that VICE's 1581 is real SD2IEC hardware.
  - id: sd2iec_profile_record_in_c64_ram
    type: memory.write
    params: { start: 0x033C, bytes_hex: "52 08 02 07" }
  - id: sd2iec_profile_reu_dma_registers
    type: memory.write
    params: { start: 0xDF02, bytes_hex: "3C 03 88 28 FF 04 00" }
  - id: sd2iec_profile_reu_dma_stash
    type: memory.write
    params: { start: 0xDF01, bytes_hex: "90" }
