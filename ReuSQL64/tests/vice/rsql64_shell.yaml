version: 1
kind: vice_task_plan
plan_id: reusql64_interactive_shell
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6912
  monitor_port_span: 40
  retry_policy:
    max_attempts: 1
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 300
    read_s: 5
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    autostart_prg: "build/rsql64_shell.d81"
    disk8: "build/rsql64_shell.d81"
    drive8_enabled: true
    drive8_type: 1581
    true_drive: false
    drive9_enabled: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_shell
    type: screen.wait_contains
    params:
      text: "RSQL>"
      wait_timeout_s: 180
      capture_label: shell_prompt
  - id: create_enum
    type: input.sequence
    params:
      keys: [67,82,69,65,84,69,32,84,89,80,69,32,83,84,65,84,69,32,65,83,32,69,78,85,77,56,40,78,69,87,61,49,44,68,79,78,69,61,50,41,13]
      inter_key_delay_s: 0.02
      post_delay_s: 0.5
  - id: create_table
    type: input.sequence
    params:
      keys: [67,82,69,65,84,69,32,84,65,66,76,69,32,84,40,73,68,32,73,49,54,44,78,65,77,69,32,67,72,65,82,40,56,41,44,78,79,84,69,32,84,69,88,84,32,78,85,76,76,44,83,84,65,84,85,83,32,83,84,65,84,69,41,13]
      inter_key_delay_s: 0.02
      post_delay_s: 0.5
  - id: insert_row
    type: input.sequence
    params:
      keys: [73,78,83,69,82,84,32,73,78,84,79,32,84,32,86,65,76,85,69,83,40,45,50,44,39,66,69,84,65,39,44,39,76,79,78,71,32,78,79,84,69,39,44,83,84,65,84,69,46,68,79,78,69,41,13]
      inter_key_delay_s: 0.02
      post_delay_s: 0.6
  - id: select_row
    type: input.sequence
    params:
      keys: [83,69,76,69,67,84,32,73,68,44,78,65,77,69,44,78,79,84,69,44,83,84,65,84,85,83,32,70,82,79,77,32,84,13]
      inter_key_delay_s: 0.02
      post_delay_s: 0.8
  - id: capture_select
    type: screen.capture
    params:
      label: shell_select
  - id: assert_select
    type: assert.screen
    params:
      contains: "-2, BETA    , LONG NOTE, 2"
  - id: show_tables
    type: input.sequence
    params:
      keys: [46,84,65,66,76,69,83,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.5
  - id: assert_table
    type: assert.screen
    params:
      contains: "TABLE T ROWS=1 COLUMNS=4"
  - id: show_schema
    type: input.sequence
    params:
      keys: [46,83,67,72,69,77,65,32,84,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.8
  - id: assert_schema
    type: assert.screen
    params:
      contains: "COLUMN NOTE TEXT NULL"
  - id: show_types
    type: input.sequence
    params:
      keys: [46,84,89,80,69,83,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.5
  - id: assert_type
    type: assert.screen
    params:
      contains: "TYPE STATE ENUM8 MEMBERS=2"
  - id: show_members
    type: input.sequence
    params:
      keys: [46,77,69,77,66,69,82,83,32,83,84,65,84,69,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.6
  - id: assert_member
    type: assert.screen
    params:
      contains: "MEMBER DONE=2"
  - id: export_select
    type: input.sequence
    params:
      keys: [46,69,88,80,79,82,84,32,83,72,69,76,76,69,88,32,83,69,76,69,67,84,32,73,68,44,78,79,84,69,44,83,84,65,84,85,83,32,70,82,79,77,32,84,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.8
  - id: capture_export
    type: screen.capture
    params:
      label: shell_export
  - id: assert_export
    type: assert.screen
    params:
      contains: "EXPORTED 1 ROWS 36 BYTES"
  - id: checkpoint
    type: input.sequence
    params:
      keys: [46,67,72,69,67,75,80,79,73,78,84,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.5
  - id: assert_checkpoint
    type: assert.screen
    params:
      contains: "CHECKPOINT READY"
  - id: quit
    type: input.sequence
    params:
      keys: [46,81,85,73,84,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.5
  - id: assert_success_sentinel
    type: assert.memory
    params:
      start: 53232
      end: 53232
      equals_hex: "a5"
  - id: assert_green_border
    type: assert.memory
    params:
      start: 53280
      end: 53280
      equals_hex: "f5"
  - id: capture_success
    type: screen.capture
    params:
      label: shell_success
  - id: state_success
    type: state.capture
    params:
      label: shell_success
