FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $7C00;
    __APP_START__: type = export, value = $0801;
    __MAIN_START__: type = export, value = $0801;
    __MAIN_SIZE__: type = export, value = $73FF;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O, fill = yes, start = $07FF, size = $0002;
    MAIN:     file = %O, fill = yes, start = $0801, size = $28FF;
    ENGINE:   file = %O, fill = yes, define = yes, start = $3100, size = $2AA0;
    WORK:     file = %O, fill = yes, define = yes, start = $5BA0, size = $2060;
    OVERLAY:  file = %O, fill = yes, define = yes, start = $7C00, size = $4400;
    ABI:      file = %O, fill = yes, define = yes, start = $C000, size = $1000;

    OVL0ADDR: file = "build/query_overlays/rsqlmeta.prg", start = $7FFE, size = $0002;
    OVL0:     file = "build/query_overlays/rsqlmeta.prg", fill = yes, start = $7C00, size = $4400;
    OVL1ADDR: file = "build/query_overlays/rsqlrow.prg", start = $7FFE, size = $0002;
    OVL1:     file = "build/query_overlays/rsqlrow.prg", fill = yes, start = $7C00, size = $4400;
    OVL2ADDR: file = "build/query_overlays/rsqlparse.prg", start = $7FFE, size = $0002;
    OVL2:     file = "build/query_overlays/rsqlparse.prg", fill = yes, start = $7C00, size = $4400;
    OVL3ADDR: file = "build/query_overlays/rsqlexec.prg", start = $7FFE, size = $0002;
    OVL3:     file = "build/query_overlays/rsqlexec.prg", fill = yes, start = $7C00, size = $4400;
    OVL4ADDR: file = "build/query_overlays/rsqlsubq.prg", start = $7FFE, size = $0002;
    OVL4:     file = "build/query_overlays/rsqlsubq.prg", fill = yes, start = $7C00, size = $4400;
    OVL5ADDR: file = "build/query_overlays/rsqlsort.prg", start = $7FFE, size = $0002;
    OVL5:     file = "build/query_overlays/rsqlsort.prg", fill = yes, start = $7C00, size = $4400;
    OVL6ADDR: file = "build/query_overlays/rsqljagg.prg", start = $7FFE, size = $0002;
    OVL6:     file = "build/query_overlays/rsqljagg.prg", fill = yes, start = $7C00, size = $4400;
    OVL7ADDR: file = "build/query_overlays/rsqladmin.prg", start = $7FFE, size = $0002;
    OVL7:     file = "build/query_overlays/rsqladmin.prg", fill = yes, start = $7C00, size = $4400;
    OVL8ADDR: file = "build/query_overlays/rsqlwide.prg", start = $7FFE, size = $0002;
    OVL8:     file = "build/query_overlays/rsqlwide.prg", fill = yes, start = $7C00, size = $4400;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    LOADADDR: load = LOADADDR,type = ro;
    EXEHDR:   load = MAIN,    type = ro;
    STARTUP:  load = MAIN,    type = ro;
    LOWCODE:  load = MAIN,    type = ro, optional = yes;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro;
    DATA:     load = MAIN,    type = rw, optional = yes;
    ENGINE:   load = ENGINE,  type = ro;
    ENGINEDATA: load = WORK,  type = rw, optional = yes;
    INIT:     load = WORK,    type = rw, optional = yes;
    ONCE:     load = WORK,    type = ro, define = yes, optional = yes;
    BSS:      load = WORK,    type = bss, define = yes;
    APPBSS:   load = WORK,    type = bss, optional = yes;
    OVL0ADDR: load = OVL0ADDR, type = ro;
    OVERLAY0: load = OVL0, type = ro, define = yes;
    OVL1ADDR: load = OVL1ADDR, type = ro;
    OVERLAY1: load = OVL1, type = ro, define = yes;
    OVL2ADDR: load = OVL2ADDR, type = ro;
    OVERLAY2: load = OVL2, type = ro, define = yes;
    OVL3ADDR: load = OVL3ADDR, type = ro;
    OVERLAY3: load = OVL3, type = ro, define = yes;
    OVL4ADDR: load = OVL4ADDR, type = ro;
    OVERLAY4: load = OVL4, type = ro, define = yes;
    OVL5ADDR: load = OVL5ADDR, type = ro;
    OVERLAY5: load = OVL5, type = ro, define = yes;
    OVL6ADDR: load = OVL6ADDR, type = ro;
    OVERLAY6: load = OVL6, type = ro, define = yes;
    OVL7ADDR: load = OVL7ADDR, type = ro;
    OVERLAY7: load = OVL7, type = ro, define = yes;
    OVL8ADDR: load = OVL8ADDR, type = ro;
    OVERLAY8: load = OVL8, type = ro, define = yes;
    ABI:      load = ABI,     type = ro;
    CONTROL:  load = ABI,     type = rw, start = $CFF0;
    CONTROLTAIL: load = ABI,  type = ro, start = $CFF7;
    CONTROLFLAG: load = ABI,  type = rw, start = $CFFF;
}

FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}
