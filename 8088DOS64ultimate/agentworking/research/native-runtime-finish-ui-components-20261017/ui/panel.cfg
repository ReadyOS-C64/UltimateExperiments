MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 MAIN:start=$8000,size=$2000,file=%O,type=rw,define=yes;
 STATE:start=$7800,size=$0800,file="",type=rw,define=yes;
 ZP:start=$0080,size=$0060,file="",type=rw,define=yes;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;
 CODE:load=MAIN,type=rw,define=yes;
 RODATA:load=MAIN,type=ro;
 DATA:load=MAIN,type=rw;
 BSS:load=STATE,type=bss,define=yes;
 ZEROPAGE:load=ZP,type=zp,define=yes;
}
