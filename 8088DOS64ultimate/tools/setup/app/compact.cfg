MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 RESIDENT:start=$0801,size=$57ff,file=%O,type=rw,fill=yes;
 UI:start=$6000,size=$5000,file=%O,type=rw;
 # Runtime UI state reuses load-only HIGH/AUX bytes AFTER complete initial
 # verification, relocation and zero-padded UI cache commit in so_prepare.
 UISTATE:start=$6000+__UI_CODE_SIZE__+__UI_RO_SIZE__,size=$5000-__UI_CODE_SIZE__-__UI_RO_SIZE__,file="",type=rw;
 FAT:start=$6000,size=$5000,file="build/fat-overlay.bin",type=ro;
 PUBLISH:start=$6000,size=$5000,file="build/publish-overlay.bin",type=rw;
 ZP:start=$0020,size=$0060,file="",type=rw;
 STATE:start=$b000,size=$1000,file="",type=rw;
 UCI:start=$c000,size=$03a0,file="",type=rw;
 AUX:start=$c3a0,size=$0460,file="",type=rw;
 DIAGNOSTIC:start=$c843,size=$00bd,file="",type=ro;
 DEVICE:start=$c800,size=$0100,file="",type=rw;
 TABLES:start=$c900,size=$0400,file="",type=rw;
 COORD:start=$f700,size=$08fa,file="",type=rw;
 HIGH:start=$e000,size=$1700,file="",type=rw;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;BASIC:load=RESIDENT,type=ro;BOOT:load=RESIDENT,type=ro;
 DEVICECODE:load=RESIDENT,type=rw;FILECODE:load=RESIDENT,type=rw;CODE:load=RESIDENT,type=rw;
 RODATA:load=RESIDENT,type=ro;DATA:load=RESIDENT,type=rw;
 UI_CODE:load=UI,type=ro,define=yes;UI_RO:load=UI,type=ro,define=yes;
 HIGH_CODE:load=UI,run=COORD,type=rw,define=yes;
 AUX_CODE:load=UI,run=AUX,type=ro,define=yes;AUX_RO:load=UI,run=AUX,type=ro,define=yes;
 BOOT_DIAG:load=UI,run=DIAGNOSTIC,type=ro,define=yes,optional=yes;
 UIBSS:load=UISTATE,type=bss,define=yes;
 FAT_CODE:load=FAT,type=ro,define=yes;FAT_RO:load=FAT,type=ro,define=yes;
 PUB_CODE:load=PUBLISH,type=ro,define=yes;PUB_RO:load=PUBLISH,type=ro,define=yes,optional=yes;
 PUBBSS:load=PUBLISH,type=bss,define=yes;
 ZEROPAGE:load=ZP,type=zp;BSS:load=STATE,type=bss,define=yes;
 HIGHBSS:load=HIGH,type=bss,define=yes;
 CRC_TABLES:load=TABLES,type=bss;DEVICESTATE:load=DEVICE,type=bss;UCIBUFFER:load=UCI,type=bss;
}
