MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 ASSET:start=$6000,size=$2000,file=%O,type=rw;
 STATE:start=$9000,size=$0800,file="",type=rw;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;
 SHARED:load=ASSET,type=ro;
 RECOVER_CODE:load=ASSET,type=ro;
 RECOVER_RO:load=ASSET,type=ro;
 RECOVER_DATA:load=ASSET,type=rw;
 CODE:load=ASSET,type=ro,optional=yes;
 RODATA:load=ASSET,type=ro,optional=yes;
 DATA:load=ASSET,type=rw,optional=yes;
 RECOVER_BSS:load=STATE,type=bss,define=yes;
}
