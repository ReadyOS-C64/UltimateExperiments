MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 MAIN:start=$0801,size=$57ff,file=%O,type=rw,fill=yes;
 PHASE:start=$6000,size=$3000,file=%O,type=rw,fill=yes;
 HIGHIMAGE:start=$9000,size=$2000,file=%O,type=ro,fill=yes;
 BOOTDIAG:start=$b000,size=$0100,file=%O,type=ro,fill=yes;
 HIGHRUN:start=$e000,size=$1ffa,file="",type=rw;
 PHASESTATE:start=$8748,size=$28b8,file="",type=rw;
 ZP:start=$0020,size=$0060,file="",type=rw;
 STATE:start=$b000,size=$1000,file="",type=rw;
 TABLES:start=$c900,size=$0400,file="",type=rw;
 UCI:start=$c000,size=$0800,file="",type=rw;
 FDSTASH:start=$b100,size=$0040,file=%O,type=ro,fill=yes;
 FDSOURCE:start=$b140,size=$0ec0,file=%O,type=ro;
 SAFEERROR:start=$bfc8,size=$0038,file="",type=ro;
 FDRUN:start=$6000,size=$1000,file="",type=ro;
}
SEGMENTS {
 FD_STASH:load=FDSTASH,type=ro,define=yes;
 FD_CODE:load=FDSOURCE,run=FDRUN,type=ro,define=yes;
 FD_SAFE:load=FDSOURCE,run=SAFEERROR,type=ro,define=yes;
 LOADADDR:load=HEADER,type=ro;
 BASIC:load=MAIN,type=ro;
 CODE:load=MAIN,type=rw;
 DEVICECODE:load=MAIN,type=rw;
 FILECODE:load=MAIN,type=rw;
 HIGH_CODE:load=MAIN,type=rw;
 RODATA:load=MAIN,type=ro;
 DATA:load=MAIN,type=rw;
 CONFIG_HIGH:load=HIGHIMAGE,run=HIGHRUN,type=rw,define=yes;
 CONFIG_HRO:load=HIGHIMAGE,run=HIGHRUN,type=ro,define=yes;
 RI_CODE:load=PHASE,type=rw,define=yes;
 RI_RO:load=PHASE,type=ro,define=yes;
 RM_CODE:load=PHASE,type=rw,define=yes;
 RM_RO:load=PHASE,type=ro,define=yes;
 BOOT_DIAG:load=BOOTDIAG,type=ro,define=yes;
 CRC_TABLES:load=TABLES,type=bss,define=yes;
 RIBSS:load=PHASESTATE,type=bss,define=yes;
 RMBSS:load=PHASESTATE,type=bss,define=yes;
 ZEROPAGE:load=ZP,type=zp;
 BSS:load=STATE,type=bss,define=yes;
 DEVICESTATE:load=STATE,type=bss,define=yes;
 CONFIG_PUBSTATE:load=STATE,type=bss,define=yes;
 UCIBUFFER:load=UCI,type=bss;
}
