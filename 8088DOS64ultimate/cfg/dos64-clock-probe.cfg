# Isolated native calibration fixture; DEVICECODE follows CODE in MAIN.
# Never link this fixture into the runtime/unit resident allocation.
MEMORY {
    HEADER: start = $0000, size = $0002, file = %O, type = ro;
    MAIN: start = $0801, size = $37FF, file = %O, type = ro;
    CONTROL: start = $E000, size = $1000, file = "", type = rw;
}
SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    BASIC: load = MAIN, type = ro;
    CODE: load = MAIN, type = ro;
    DEVICECODE: load = MAIN, type = ro;
    BSS: load = CONTROL, type = bss;
    DEVICESTATE: load = CONTROL, type = bss, start = $EA00;
}
