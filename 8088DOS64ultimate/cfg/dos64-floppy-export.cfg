MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 ZP:start=$0020,size=$00c0,file="",type=rw;
 MAIN:start=$0801,size=$37ff,file=%O,type=rw;
 UCI:start=$c100,size=$0800,file="",type=rw;
 CONTROL:start=$e000,size=$1000,file="",type=rw;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;
 BASIC:load=MAIN,type=ro;
 CODE:load=MAIN,type=rw,define=yes;
 DEVICECODE:load=MAIN,type=rw,define=yes;
 FILECODE:load=MAIN,type=rw,define=yes;
 RODATA:load=MAIN,type=ro,optional=yes;
 ZEROPAGE:load=ZP,type=zp;
 BSS:load=CONTROL,type=bss;
 DEVICESTATE:load=CONTROL,type=bss,start=$ea00;
 UCIBUFFER:load=UCI,type=bss;
}
