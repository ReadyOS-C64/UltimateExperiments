# Contiguous runtime PRG: 0801..3FFF, zeroed display startup area, then resident device code.
# Standalone hardware helpers deliberately retain dos64.cfg and their exact binary identity.
MEMORY {
    HEADER: start = $0000, size = $0002, file = %O, type = ro;
    ZP: start = $0020, size = $00C0, file = "", type = rw, define = yes;
    MAIN: start = $0801, size = $37FF, file = %O, type = rw, fill = yes, fillval = $00, define = yes;
    # Explicit startup zero initialization of matrix/font RAM, never executable code.
    INITVIDEO: start = $4000, size = $1000, file = %O, type = ro, fill = yes, fillval = $00, define = yes;
    DEVICE: start = $5000, size = $1000, file = %O, type = ro, define = yes;
    # Separately emitted, mutually exclusive run images; native bootstrap
    # installs packaged 6000/6800 startup sources into immutable REU slots.
    FILE: start = $C900, size = $0700, file = "%O.files.bin", type = rw, define = yes;
    LOADER_RUN: start = $6000, size = $0800, file = "", type = rw, define = yes;
    RENDER: start = $C900, size = $0700, file = "%O.render.bin", type = rw, define = yes;
    # Separate cold startup image; discarded before VIC bitmap ownership.
    INPUT: start = $C900, size = $0700, file = "%O.input.bin", type = rw, define = yes;
    PIT: start = $C900, size = $0700, file = "%O.pit.bin", type = rw, define = yes;
    GFX: start = $C900, size = $0700, file = "%O.gfx.bin", type = rw, define = yes;
    HD: start=$C900,size=$0700,file="%O.hd.bin",type=rw,define=yes;
    DISK: start=$C900,size=$0700,file="%O.disk.bin",type=rw,define=yes;
    HDEXT: start=$F000,size=$0E00,file="%O.hdb.bin",type=rw,define=yes;
    SAVER: start=$B010,size=$07F0,file="%O.saver.bin",type=rw,define=yes;
    IMPORT: start = $7000, size = $1000, file = "%O.import.bin", type = rw, define = yes;
    BOUNCE_RAM: start = $C000, size = $0100, file = "", type = rw, define = yes;
    UCI_RAM: start = $C100, size = $0800, file = "", type = rw, define = yes;
    CONTROL: start = $E000, size = $1000, file = "", type = rw, define = yes;
}
SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    BASIC: load = MAIN, type = ro;
    CODE: load = MAIN, type = ro, define = yes;
    RODATA: load = MAIN, type = ro, optional = yes;
    TESTCODE: load = MAIN, type = ro, optional = yes;
    LOADERCOLD: load = INITVIDEO, type = ro, start = $4000, optional = yes, define = yes;
    NARROWFONT: load = INITVIDEO, type = ro, start = $4400, define = yes;
    FULLFONT: load = INITVIDEO, type = ro, start = $4800, define = yes;
    DEVICECODE: load = DEVICE, type = ro, optional = yes, define = yes;
    FILECODE: load = FILE, type = ro, optional = yes, define = yes;
    LOADERADOPT: load = FILE, run = LOADER_RUN, type = ro, optional = yes, define = yes;
    RENDERCODE: load = RENDER, type = ro, optional = yes, define = yes;
    DISPLAYCODE: load = RENDER, type = ro, define = yes;
    IRQMAIN: load = PIT, type = ro, define = yes;
    IRQDEVICE: load = PIT, type = ro, define = yes;
    PITCODE: load = PIT, type = ro, define = yes;
    GFXCODE: load = GFX, type = ro, define = yes;
    HDCODE: load=HD,type=ro,define=yes;
    DISKCODE: load=DISK,type=ro,define=yes;
    HDBIOS: load=HDEXT,type=ro,define=yes;
    SAVERCODE: load=SAVER,type=rw,define=yes;
    IMPORTCODE: load = IMPORT, type = rw, optional = yes, define = yes;
    COLDINIT: load = IMPORT, type = ro, optional = yes, define = yes;
    COLDRODATA: load = IMPORT, type = ro, optional = yes, define = yes;
    UNITCOLD: load = IMPORT, type = ro, optional = yes, define = yes;
    INPUTCODE: load = INPUT, type = ro, optional = yes, define = yes;
    NATIVESTATE: load = MAIN, type = rw, optional = yes, define = yes;
    ZEROPAGE: load = ZP, type = zp, define = yes;
    BSS: load = CONTROL, type = bss, define = yes;
    RANGEBUFFER: load = BOUNCE_RAM, type = bss, optional = yes, define = yes;
    UCIBUFFER: load = UCI_RAM, type = bss, optional = yes, define = yes;
    PAGEMAP: load = CONTROL, type = bss, start = $E100, optional = yes;
    CACHEMETA: load = CONTROL, type = bss, start = $E900, optional = yes;
    DEVICESTATE: load = CONTROL, type = bss, start = $EA00, optional = yes;
}
