MEMORY {
 HEADER:start=$0000,size=$0002,file=%O,type=ro;
 MAIN:start=$0801,size=$17FF,file=%O,type=rw;
 ZP:start=$00FB,size=$0004,file="",type=rw;
 STATE:start=$2000,size=$0100,file="",type=rw;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;
 BASIC:load=MAIN,type=ro;
 CODE:load=MAIN,type=ro,define=yes;
 RODATA:load=MAIN,type=ro;
 DATA:load=MAIN,type=rw;
 ZEROPAGE:load=ZP,type=zp;
 BSS:load=STATE,type=bss;
}
