# Standalone image. No memory definition covers the ReadyOS shim C600-C9FF.
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw;
    HEADER: file = %O, start = $07FF, size = $0002;
    BOOT:   file = %O, start = $0801, size = $07FF, fill = yes, fillval = 0;
    CORE:   file = %O, start = $1000, size = $3000, type = rw, define = yes;
    DISPLAY_PLAN: file="",start=$4400,size=$0370,type=rw;
    DISPLAY_CHECKPOINT: file="",start=$4770,size=$0090,type=rw;
    # Session tables are CPU-only BSS, never PRG fill across the ReadyOS gap.
    SESSION_CATALOG: file="",start=$CA00,size=$0180,type=rw;
    SESSION_SETTINGS: file="",start=$CB80,size=$0040,type=rw;
    FONT_STORE: file="",start=$CBC0,size=$0040,type=rw;
    PREVIEW_WORK: file="",start=$CC00,size=$0400,type=rw;
    STYLE_WORK: file="",start=$8D00,size=$0480,type=rw;
    FOLD_WORK: file="",start=$8D00,size=$0480,type=rw; #owner3 phase alias
    VIEW_WORK: file = "", start = $8C00, size = $0100, type = rw;
    LINE_WORK: file = "", start = $8D00, size = $0480, type = rw;
    # Deliberate phase union with LINE_WORK; resident se_f_owner guards C8.
    FILE_WORK: file = "", start = $8D00, size = $0480, type = rw;
    NAV_WORK: file = "", start = $9180, size = $0080, type = rw;
    DOC_WORK: file = "", start = $9A00, size = $0400, type = rw;
    OBJECT_WORK: file = "", start = $9E00, size = $0200, type = rw;
    STATE:  file = "", start = $C000, size = $0600, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = HEADER, type = ro;
    BOOT:     load = BOOT, type = ro;
    COLD: load = BOOT, type = ro, optional = yes;
    ENTRY:    load = CORE, type = ro;
    CODE:     load = CORE, type = ro;
    CORE:     load = CORE, type = ro, optional = yes;
    RODATA:   load = CORE, type = ro;
    CRC_TABLE: load = CORE, type = ro, align = $100, optional = yes;
    LAYOUT_CODE: load = CORE, type = ro, optional = yes;
    VIEWSTATE: load = VIEW_WORK, type = bss, optional = yes;
    OVERLAY_CATALOG: load=SESSION_CATALOG,type=bss,optional=yes;
    SETTINGS_STATE: load=SESSION_SETTINGS,type=bss,optional=yes;
    FONT_STORE_STATE: load=FONT_STORE,type=bss,optional=yes;
    PREVIEW_STATE: load=PREVIEW_WORK,type=bss,optional=yes;
    STYLE_DESCRIPTOR: load=VIEW_WORK,type=bss,optional=yes;
    STYLE_PLAN: load=DISPLAY_PLAN,type=bss,optional=yes;
    STYLE_CHECKPOINT: load=DISPLAY_CHECKPOINT,type=bss,optional=yes;
    STYLE_STATE: load=STYLE_WORK,type=bss,optional=yes,define=yes;
    SM_STATE: load=STYLE_WORK,type=bss,optional=yes,define=yes;
    FOLD_SOURCE_STATE: load=STYLE_WORK,type=bss,optional=yes,define=yes;
    FOLD_STATE: load=FOLD_WORK,start=$8D00,type=bss,optional=yes,define=yes;
    FOLD_BUILD_STATE: load=FOLD_WORK,start=$8E60,type=bss,optional=yes,define=yes;
    FOLD_BUFFER: load=FOLD_WORK,start=$8EB9,type=bss,optional=yes;
    FOLD_BUILD_BUFFER: load=FOLD_WORK,start=$8F36,type=bss,optional=yes;
    LINEINDEX: load = LINE_WORK, type = bss, optional = yes;
    FILESTATE: load = FILE_WORK, type = bss, optional = yes, define = yes;
    NAVSTATE: load = NAV_WORK, type = bss, optional = yes;
    DOCSTATE: load = DOC_WORK, type = bss, optional = yes;
    OBJECTS: load = OBJECT_WORK, type = bss, optional = yes;
    BSS:      load = STATE, type = bss, define = yes;
}
