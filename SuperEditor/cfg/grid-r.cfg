# One verified rendering leaf: code/tables, fixed narrow font A800,
# fixed native UI font AC00. All output and caller scratch remain external.
MEMORY { IMAGE:file=%O,start=$A000,size=$1000,type=rw,fill=yes; }
SEGMENTS {
    CODE:load=IMAGE,type=ro;
    RODATA:load=IMAGE,type=ro;
    NARROW_FONT:load=IMAGE,type=ro,start=$A800,optional=yes;
    NATIVE_FONT:load=IMAGE,type=ro,start=$AC00;
}
