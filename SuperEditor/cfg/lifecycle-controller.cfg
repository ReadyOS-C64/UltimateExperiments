# C29 LIFECTRL: executable controller + trusted fresh low-memory template.
# The template remains inside the sealed asset; no separate raw D81 file.
MEMORY {
    CONTROL: file=%O, start=$B000, size=$0800, fill=yes;
    TEMPLATE: file=%O, start=$B800, size=$0100, fill=yes;
    COLD: file="", start=$0A00, size=$0100;
}
SEGMENTS {
    CODE: load=CONTROL, type=ro;
    RODATA: load=CONTROL, type=ro;
    RESUME: load=TEMPLATE, run=COLD, type=ro;
}
