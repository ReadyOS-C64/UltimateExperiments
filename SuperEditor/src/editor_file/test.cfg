MEMORY {
 SLOT: file=%O,start=$6000,size=$1000,type=ro;
 OUTSIDE: file="",start=$C5E0,size=$20,type=rw;
 UNION: file="",start=$8D00,size=$480,type=rw;
}
SEGMENTS {
 CODE: load=SLOT,type=ro;
 RODATA: load=SLOT,type=ro,optional=yes;
 BSS: load=OUTSIDE,type=bss,optional=yes;
 FILESTATE: load=UNION,type=bss,optional=yes,define=yes;
}
