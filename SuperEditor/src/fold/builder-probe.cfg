MEMORY {
 CORE:file=%O,start=$1000,size=$0800,type=rw,fill=yes;
 BUILD_RETAIN:file=%O,start=$1800,size=$0800,type=rw,fill=yes;
 BUILD_PARSE:file=%O,start=$2000,size=$1000,type=rw,fill=yes;
 BUILD_FILTER:file=%O,start=$3000,size=$1000,type=rw,fill=yes;
 STORE:file=%O,start=$4000,size=$1000,type=rw,fill=yes;
 VALIDATE:file=%O,start=$5000,size=$1000,type=rw,fill=yes;
 QUERY:file=%O,start=$6000,size=$1000,type=rw,fill=yes;
 ACTION:file=%O,start=$7000,size=$1000,type=rw,fill=yes;
 GAP:file=%O,start=$8000,size=$3000,type=rw,fill=yes;
 PARSER:file=%O,start=$B000,size=$1000,type=rw,fill=yes;
 FSTATE:file="",start=$C000,size=$00C5,type=rw;
 BUILD_STATE:file="",start=$C100,size=$0100,type=rw;
 PARSER_STATE:file="",start=$C200,size=$0100,type=rw;
}
SEGMENTS {
 CODE:load=CORE,type=ro;
 FOLD_BUILD_RETAIN:load=BUILD_RETAIN,type=ro,define=yes;
 FOLD_BUILD_PARSE:load=BUILD_PARSE,type=ro,define=yes;
 FOLD_BUILD_FILTER:load=BUILD_FILTER,type=ro,define=yes;
 FOLD_STORE:load=STORE,type=ro,define=yes;
 FOLD_VALIDATE:load=VALIDATE,type=ro,define=yes;
 FOLD_QUERY:load=QUERY,type=ro,define=yes;
 FOLD_ACTION:load=ACTION,type=ro,define=yes;
 FOLD_BUFFER:load=GAP,start=$8800,type=bss;
 FOLD_BUILD_BUFFER:load=GAP,start=$9000,type=bss;
 OBJECTS:load=GAP,start=$9E00,type=bss;
 BSS:load=GAP,start=$A000,type=bss;
 SM_BLOCK:load=PARSER,type=ro,define=yes;
 FOLD_STATE:load=FSTATE,type=bss,define=yes;
 FOLD_BUILD_STATE:load=BUILD_STATE,type=bss,define=yes;
 SM_STATE:load=PARSER_STATE,type=bss,define=yes;
}
