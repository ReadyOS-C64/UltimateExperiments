MEMORY {
 CORE:file=%O,start=$1000,size=$3000,type=rw,fill=yes;
 STORE:file=%O,start=$4000,size=$1000,type=rw,fill=yes;
 VALIDATE:file=%O,start=$5000,size=$1000,type=rw,fill=yes;
 QUERY:file=%O,start=$6000,size=$1000,type=rw,fill=yes;
 ACTION:file=%O,start=$7000,size=$1000,type=rw,fill=yes;
 BUFFER:file="",start=$8800,size=$0020,type=rw;
 OBJ:file="",start=$9E00,size=$0200,type=rw;
 STATE:file="",start=$A000,size=$0800,type=rw,define=yes;
 FSTATE:file="",start=$C000,size=$0600,type=rw,define=yes;
}
SEGMENTS {
 CODE:load=CORE,type=ro;
 FOLD_STORE:load=STORE,type=ro,define=yes;
 FOLD_VALIDATE:load=VALIDATE,type=ro,define=yes;
 FOLD_QUERY:load=QUERY,type=ro,define=yes;
 FOLD_ACTION:load=ACTION,type=ro,define=yes;
 FOLD_BUFFER:load=BUFFER,type=bss;
 OBJECTS:load=OBJ,type=bss;
 BSS:load=STATE,type=bss;
 FOLD_STATE:load=FSTATE,type=bss,define=yes;
}
