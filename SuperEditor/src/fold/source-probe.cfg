# Private CPU capsule against frozen resident externals; not product placement.
MEMORY {
 R1:file="build/folds/editor-source/r1.bin",start=$5000,size=$1000,type=rw,fill=yes;
 R2:file="build/folds/editor-source/r2.bin",start=$6000,size=$1000,type=rw,fill=yes;
 C:file="build/folds/editor-source/c.bin",start=$B000,size=$1000,type=rw,fill=yes;
 PHASE:file="",start=$8D00,size=$0480,type=rw;
}
SEGMENTS {
 FOLD_BUILD_PARSE:load=R1,type=ro,define=yes;
 SM_BLOCK:load=R1,type=ro,define=yes;
 FOLD_STORE:load=R1,type=ro,define=yes;
 FOLD_QUERY:load=R1,type=ro,define=yes;
 FOLD_BUILD_FILTER:load=R2,type=ro,define=yes;
 FOLD_BUILD_RETAIN:load=R2,type=ro,define=yes;
 FOLD_VALIDATE:load=R2,type=ro,define=yes;
 FOLD_ACTION:load=R2,type=ro,define=yes;
 FOLD_SOURCE_CLEANUP:load=R2,type=ro,define=yes;
 FOLD_SOURCE_CODE:load=C,type=ro,define=yes;
 FOLD_STATE:load=PHASE,type=bss,define=yes;
 FOLD_BUILD_STATE:load=PHASE,type=bss,define=yes;
 SM_STATE:load=PHASE,type=bss,define=yes;
 FOLD_SOURCE_STATE:load=PHASE,type=bss,define=yes;
 FOLD_BUFFER:load=PHASE,type=bss;
 FOLD_BUILD_BUFFER:load=PHASE,type=bss,define=yes;
}
