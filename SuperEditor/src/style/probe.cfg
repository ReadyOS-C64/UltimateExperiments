# Isolated placements only. The style/parser CODE is linked together below4K.
MEMORY {
 FIXTURE:file=%O,start=$1000,size=$0800,type=rw,fill=yes;
 GAP:file=%O,start=$1800,size=$9800,type=rw,fill=yes;
 STYLE:file=%O,start=$B000,size=$1000,type=rw,fill=yes;
 PLAN:file="",start=$4400,size=$0370,type=rw;
 CHECKPOINT:file="",start=$4770,size=$0090,type=rw;
 DESCRIPTOR:file="",start=$8CC6,size=$0025,type=rw;
 PHASE:file="",start=$8D00,size=$0480,type=rw;
 FSTATE:file="",start=$9A00,size=$0100,type=rw;
}
SEGMENTS {
 CODE:load=FIXTURE,type=ro;
 STYLE_CODE:load=STYLE,type=ro,define=yes;
 SM_BLOCK:load=STYLE,type=ro,define=yes;
 SM_INLINE:load=STYLE,type=ro,define=yes;
 STYLE_DESCRIPTOR:load=DESCRIPTOR,type=bss,define=yes;
 STYLE_CHECKPOINT:load=CHECKPOINT,type=bss,define=yes;
 STYLE_STATE:load=PHASE,type=bss,define=yes;
 SM_STATE:load=PHASE,type=bss,define=yes;
 FIXTURE_STATE:load=FSTATE,type=bss;
}
