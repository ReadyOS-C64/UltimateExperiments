MEMORY {
 IMAGE:file=%O,start=$B000,size=$1000,type=rw;
 STAGE:file="",start=$5000,size=$1000,type=rw;
 PHASE:file="",start=$8D00,size=$003C,type=rw;
}
SEGMENTS {
 C31_HEADER:load=IMAGE,type=ro;
 CODE:load=IMAGE,run=STAGE,type=ro,define=yes;
 SM_LEXER:load=IMAGE,run=STAGE,type=ro,define=yes;
 RODATA:load=IMAGE,run=STAGE,type=ro,define=yes;
 SM_STATE:load=PHASE,type=bss;
}
