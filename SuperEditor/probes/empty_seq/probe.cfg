MEMORY {
 HEADER:file=%O,start=$07FF,size=$0002;
 BOOT:file=%O,start=$0801,size=$07FF,fill=yes,fillval=0;
 CORE:file=%O,start=$1000,size=$3000,type=rw,define=yes;
 STATE:file="",start=$C000,size=$0600,type=rw,define=yes;
}
SEGMENTS {
 LOADADDR:load=HEADER,type=ro;
 BOOT:load=BOOT,type=ro;
 ENTRY:load=CORE,type=ro;
 CODE:load=CORE,type=ro;
 RODATA:load=CORE,type=ro;
 BSS:load=STATE,type=bss,define=yes;
}
