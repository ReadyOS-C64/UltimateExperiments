MEMORY {
 BLOCK: file=%O,start=$8000,size=$1000,type=ro,fill=yes;
 INLINE: file=%O,start=$9000,size=$1000,type=ro,fill=yes;
 LEXER: file=%O,start=$A000,size=$1000,type=ro,fill=yes;
 STATE: start=$C000,size=$600,type=rw;
}
SEGMENTS {
 SM_BLOCK:load=BLOCK,type=ro;
 SM_INLINE:load=INLINE,type=ro,optional=yes;
 SM_LEXER:load=LEXER,type=ro,optional=yes;
 SM_STATE:load=STATE,type=bss,define=yes;
}
