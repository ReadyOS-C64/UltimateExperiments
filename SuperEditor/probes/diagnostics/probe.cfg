MEMORY {
 ZP:file="",start=$0002,size=$001A,type=rw;
 CORE:file=%O,start=$1000,size=$3000,type=rw;
 DIAG_SLOT:file="build/diagnostics/diagnostics.bin",start=$B000,size=$1000,type=rw;
 DOC:file="",start=$9A00,size=$0400,type=rw;
 OBJ:file="",start=$9E00,size=$0200,type=rw;
 STATE:file="",start=$C000,size=$0600,type=rw,define=yes;
}
SEGMENTS {
 ZEROPAGE:load=ZP,type=zp;
 CODE:load=CORE,type=ro;
 RODATA:load=CORE,type=ro,optional=yes;
 DIAG_CODE:load=DIAG_SLOT,type=ro,define=yes;
 DOCSTATE:load=DOC,type=bss;
 OBJECTS:load=OBJ,type=bss;
 BSS:load=STATE,type=bss,define=yes;
}
